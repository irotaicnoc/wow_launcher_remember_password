name: Build and release Windows exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install UPX
        run: choco install upx -y --no-progress

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Build exe
        run: >-
          uv run pyinstaller
          --onefile --noconsole --name wow-launcher
          --icon="assets/wotlk_icon.ico"
          --add-data "assets/2fa_prompt_small.jpg;assets"
          --add-data "assets/wotlk_icon.ico;assets"
          --exclude-module setuptools
          --exclude-module pkg_resources
          --exclude-module _distutils_hack
          --exclude-module numpy.f2py
          --exclude-module numpy.testing
          --exclude-module numpy.tests
          --exclude-module numpy.distutils
          --exclude-module numpy._pyinstaller
          --exclude-module unittest
          --exclude-module doctest
          --exclude-module pydoc
          --exclude-module pydoc_data
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: wow-launcher-exe
          path: dist/wow-launcher.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wow-launcher.exe
          generate_release_notes: true
